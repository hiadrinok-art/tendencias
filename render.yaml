# Configuração para publicar no Render (https://render.com): New > Blueprint > este repositório.
services:
  - type: web
    name: radar-de-editais
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/iniciar.sh
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: RADAR_SEGREDO
        generateValue: true      # o Render cria um segredo aleatório
      - key: RADAR_BANCO
        value: dados/radar.db
      - key: RADAR_PROXIES
        value: "*"               # IP real vem do proxy do Render
      - key: RADAR_HTTPS
        value: "1"
      # WhatsApp (opcional). Sem estas variáveis, os alertas ficam em modo de teste.
      # Preencha no painel do Render (Environment); veja docs/WHATSAPP.md.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: RADAR_SITE
        sync: false              # endereço público do site, ex.: https://radar-de-editais.onrender.com
