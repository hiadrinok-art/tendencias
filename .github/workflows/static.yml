# Publica a demonstração do Radar de Editais no GitHub Pages.
# Publica SÓ a pasta gerada (_site), nunca o repositório inteiro.
# Roda a cada push no main, todo dia às 06:17 (Brasília) para atualizar os
# editais, e quando disparado à mão pela aba Actions.
name: Publicar demonstração no Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Rodar os testes
        run: python -m pytest -q
      - name: Coletar editais e gerar o site
        # O PNCP desacelera pedidos seguidos; após 25 min publica o que já coletou.
        run: python scripts/gerar_demo.py --saida _site --dias 4 --limite-minutos 25
      - name: Preparar o Pages
        uses: actions/configure-pages@v5
      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
