<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>{{TITULO}}</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="estilos/cordel.css">
<style id="estilo-cena"></style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="{{DUR}}">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="aspero" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="r"/>
    <feDisplacementMap in="SourceGraphic" in2="r" scale="7" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
  <div id="tremor"><div id="mundo" data-layout-allow-overflow></div></div>
  <div id="luz" data-layout-ignore></div>
  <div id="grao" data-layout-ignore></div>
  <div id="pisca" data-layout-ignore></div>
  <script src="assets/gsap.min.js"></script>
  <script src="geo.js"></script>
  <script src="biblioteca.js"></script>
  <script src="plano.js"></script>
  <script src="motor.js"></script>
  <script src="cena.js"></script>
</div>
</body>
</html>
