<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>LOA 2027 Recife — Colagem</title>
<style>
  :root{--ink:#0B1A3D;--blue:#1E6BFF;--sky:#55B8FF;--orange:#FF7A1A;--cream:#F3EBDD;--grain:none;}
  html,body{margin:0;padding:0;background:#10235A;}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif;color:var(--cream);
    background-color:#12285E;background-image:var(--grain),radial-gradient(1100px 900px at 50% 40%, #1d3d8a 0%, #12285E 55%, #0c1c45 100%);
    background-blend-mode:multiply,normal;}
  canvas{position:absolute;inset:0;}
  #ov{position:absolute;inset:0;}
  #grainov{position:absolute;inset:-40px;background-image:var(--grain);mix-blend-mode:multiply;opacity:.35;pointer-events:none;}
  .deco{position:absolute;background-image:var(--grain);background-blend-mode:multiply;box-shadow:8px 10px 0 rgba(0,0,0,.28);}
  .beat{position:absolute;left:540px;width:960px;text-align:center;opacity:0;filter:drop-shadow(7px 9px 0 rgba(0,0,0,.38));}
  .anc{width:auto;white-space:nowrap;}
  .paper{background-image:var(--grain);background-blend-mode:multiply;}
  .strip{background-color:var(--cream);background-image:var(--grain);background-blend-mode:multiply;color:var(--ink);padding:2px 20px;
         -webkit-box-decoration-break:clone;box-decoration-break:clone;}
  .h1{font-family:'Inter Display','Inter';font-weight:900;font-size:84px;line-height:1.32;letter-spacing:-1px;text-transform:uppercase;}
  .h2{font-family:'Inter Display','Inter';font-weight:800;font-size:58px;line-height:1.38;letter-spacing:-.5px;}
  .strip .hl,.hl .strip{color:#E35A00;} .strip .hb{color:#1E6BFF;}
  .h1.hl .strip,.h2.hl .strip{background-color:var(--orange);color:var(--cream);}
  .p{font-weight:700;font-size:46px;line-height:1.3;color:var(--cream);}
  .p b{color:#fff;}
  .hl{color:#FF8A3D;} .hb{color:var(--sky);}
  .mega{display:block;font-size:168px;line-height:1;margin:14px 0;white-space:nowrap;}
  .tile{display:inline-block;font-size:.56em;line-height:1;padding:7px 8px 3px;margin:4px 2px;vertical-align:middle;
        background-image:var(--grain);background-blend-mode:multiply;box-shadow:5px 7px 0 rgba(0,0,0,.35);}
  .tile.sp{width:.22em;padding:0;box-shadow:none;background:none;}
  .unit{display:inline-block;font-family:'Inter Display','Inter';font-weight:900;font-size:58px;letter-spacing:6px;text-transform:uppercase;
        color:var(--cream);background-color:var(--orange);background-image:var(--grain);background-blend-mode:multiply;padding:12px 34px 8px;transform:rotate(-2deg);
        clip-path:polygon(0 6%,4% 0,12% 5%,22% 1%,35% 6%,48% 0,61% 5%,74% 1%,86% 6%,96% 0,100% 7%,98% 50%,100% 94%,92% 100%,80% 95%,66% 100%,52% 95%,38% 100%,24% 94%,11% 100%,2% 95%,0 50%);}
  .kicker{display:inline-block;font-weight:900;font-size:30px;letter-spacing:6px;text-transform:uppercase;color:var(--ink);
          background-color:rgba(243,226,190,.95);background-image:var(--grain);background-blend-mode:multiply;padding:16px 46px;transform:rotate(-1.5deg);
          clip-path:polygon(0 8%,3% 22%,1% 40%,4% 58%,0 78%,3% 100%,97% 92%,100% 75%,97% 56%,100% 36%,97% 18%,100% 0);}
  .kicker.blue{background-color:#9FD3FF;}
  .card{display:inline-block;background-color:var(--cream);background-image:var(--grain);background-blend-mode:multiply;color:var(--ink);
        padding:36px 46px;transform:rotate(-1.2deg);}
  .card .strip{background:none;padding:0;}
  .card .p{color:#33456e;} .card .p b{color:var(--ink);}
  .card.warn{background-color:#FFD9B8;}
  .badge{font-weight:900;font-size:28px;letter-spacing:5px;text-transform:uppercase;margin-bottom:14px;}
  .card .hb{color:#1E6BFF;} .card .hl{color:#E35A00;}
  .chips{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:34px;}
  .chip{font-weight:900;font-size:40px;padding:14px 30px 10px;color:var(--ink);background-color:var(--cream);background-image:var(--grain);background-blend-mode:multiply;box-shadow:5px 7px 0 rgba(0,0,0,.35);}
  .chip.o{background-color:var(--orange);color:var(--cream);}
  .chip:nth-child(2){transform:rotate(2deg);} .chip:nth-child(1){transform:rotate(-2deg);} .chip:nth-child(3){transform:rotate(-1deg);}
  .lab{display:inline-block;text-align:center;background-color:#0B1A3D;background-image:var(--grain);background-blend-mode:multiply;padding:12px 24px 10px;transform:rotate(-1.5deg);}
  .lab .y{font-weight:800;font-size:30px;letter-spacing:4px;color:#B9CCF2;}
  .lab .v{font-family:'Inter Display','Inter';font-weight:900;font-size:52px;letter-spacing:-1px;}
  .lab .s{font-weight:700;font-size:28px;color:#B9CCF2;}
  .tag9{display:inline-block;text-align:left;margin-left:26px;background-color:#0B1A3D;background-image:var(--grain);background-blend-mode:multiply;padding:10px 22px 8px;transform:rotate(-1deg);}
  .tiny{font-weight:600;font-size:24px;color:rgba(243,235,221,.75);letter-spacing:1px;}
  #hud-top{position:absolute;left:60px;right:60px;top:70px;display:flex;justify-content:space-between;align-items:center;}
  #hud-top .t{font-weight:900;font-size:28px;letter-spacing:6px;color:var(--ink);background-color:var(--cream);background-image:var(--grain);background-blend-mode:multiply;padding:8px 18px 6px;transform:rotate(-1deg);box-shadow:4px 5px 0 rgba(0,0,0,.3);}
  #hud-top .t span{color:#E35A00;}
  #hud-top .n{font-weight:900;font-size:28px;letter-spacing:4px;color:var(--cream);}
  #prog{position:absolute;left:60px;right:60px;top:136px;height:10px;background:rgba(243,235,221,.18);}
  #prog i{display:block;height:100%;width:0;background-color:var(--orange);background-image:var(--grain);background-blend-mode:multiply;}
  #sig{position:absolute;left:0;right:0;bottom:66px;display:flex;justify-content:center;}
  #sig .pp{position:relative;background-color:var(--cream);background-image:var(--grain);background-blend-mode:multiply;padding:20px 48px 14px;transform:rotate(-1.5deg);box-shadow:7px 9px 0 rgba(0,0,0,.35);text-align:center;}
  #sig .pp:before,#sig .pp:after{content:'';position:absolute;top:-18px;width:110px;height:38px;background:rgba(243,226,190,.85);}
  #sig .pp:before{left:-34px;transform:rotate(-28deg);} #sig .pp:after{right:-34px;transform:rotate(24deg);}
  #sig .name{font-family:'Inter Display','Inter';font-weight:900;font-size:44px;letter-spacing:10px;color:var(--ink);}
  #sig .name b{color:#E35A00;}
  #sig .role{font-weight:800;font-size:20px;letter-spacing:6px;color:#4a5d88;margin-top:4px;}
  .sheet{position:absolute;top:-300px;width:1500px;height:2600px;left:-1800px;transform:rotate(8deg);background-image:var(--grain);background-blend-mode:multiply;
         box-shadow:-14px 0 0 rgba(0,0,0,.3),14px 0 0 rgba(0,0,0,.3);
         clip-path:polygon(2% 0,0 4%,2% 9%,0 15%,3% 21%,1% 28%,3% 35%,0 42%,2% 49%,0 56%,3% 63%,1% 70%,3% 77%,0 84%,2% 91%,0 100%,100% 100%,98% 95%,100% 88%,97% 81%,99% 74%,97% 67%,100% 60%,98% 53%,100% 46%,97% 39%,99% 32%,97% 25%,100% 18%,98% 11%,100% 5%,98% 0);}
  #sweep{background-color:var(--orange);} #sweep2{background-color:#1E6BFF;}
  #flash{position:absolute;inset:0;background:#F3EBDD;opacity:0;pointer-events:none;}
  .logo .em b{color:#E35A00;} .logo .em{font-family:'Inter Display','Inter';font-weight:900;line-height:1;}
  .logo .line{width:520px;height:16px;margin:30px auto;background-color:var(--orange);background-image:var(--grain);background-blend-mode:multiply;transform:rotate(-1deg);}
</style>
</head>
<body>
<div id="stage">
  <div class="deco" id="d1" style="left:-60px;top:300px;width:260px;height:70px;background-color:#FF7A1A;transform:rotate(-14deg)"></div><div class="deco" id="d2" style="right:-50px;top:980px;width:240px;height:60px;background-color:#55B8FF;transform:rotate(11deg)"></div><div class="deco" id="d3" style="left:-40px;bottom:330px;width:200px;height:200px;border-radius:50%;background-color:#1E6BFF;opacity:.55"></div><canvas id="c" width="1080" height="1920"></canvas><div id="grainov"></div>
  <div id="ov"></div>
  <div id="hud-top"><div class="t">LOA <span>2027</span> · RECIFE</div><div class="n" id="scn">01 / 10</div></div>
  <div id="prog"><i></i></div>
  <div id="sig"><div class="pp"><div class="name">EDUARDO <b>MOURA</b></div><div class="role">ANÁLISE DO ORÇAMENTO PÚBLICO</div></div></div>
  <div id="sweep" class="sheet"></div><div id="sweep2" class="sheet"></div>
  <div id="flash"></div>
</div>
<script src="node_modules/three/build/three.min.js"></script>
<script>
const W=1080,H=1920,DUR=240;
THREE.ColorManagement.legacyMode=false;
// ---------- paper grain ----------
function grainCanvas(sz=512,seed=5){const cv=document.createElement('canvas');cv.width=cv.height=sz;const x=cv.getContext('2d');const id=x.createImageData(sz,sz);let r=seed;const R=()=>{r=(r*1664525+1013904223)>>>0;return r/4294967296;};
  for(let i=0;i<sz*sz;i++){const v=226+R()*29;id.data[i*4]=v;id.data[i*4+1]=v-2;id.data[i*4+2]=v-6;id.data[i*4+3]=255;}x.putImageData(id,0,0);
  x.globalAlpha=.10;for(let i=0;i<500;i++){x.strokeStyle=R()<.5?'#8a7a60':'#ffffff';x.lineWidth=.6+R();x.beginPath();const a=R()*sz,b=R()*sz,l=8+R()*30,an=R()*6.28;x.moveTo(a,b);x.quadraticCurveTo(a+Math.cos(an)*l*.5+R()*6,b+Math.sin(an)*l*.5,a+Math.cos(an)*l,b+Math.sin(an)*l);x.stroke();}
  x.globalAlpha=.06;for(let i=0;i<60;i++){x.fillStyle='#6b5a40';x.beginPath();x.arc(R()*sz,R()*sz,10+R()*40,0,7);x.fill();}return cv;}
const GRAIN=grainCanvas();document.getElementById('stage').style.setProperty('--grain',`url(${GRAIN.toDataURL()})`);
const paperTex=new THREE.CanvasTexture(GRAIN);paperTex.wrapS=paperTex.wrapT=THREE.RepeatWrapping;paperTex.encoding=THREE.sRGBEncoding;
const SC=[0,15,35,60,90,120,140,165,195,225,240];
const C={blue:0x1E6BFF,sky:0x55B8FF,orange:0xFF7A1A,amber:0xFFB25E,navy:0x071433,white:0xF4F8FF};

// ---------- math helpers ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3);
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const lerp=(a,b,k)=>a+(b-a)*k;
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const fmt=(v,d)=>v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});

// ---------- three setup ----------
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x12285E,16,34);
const camera=new THREE.PerspectiveCamera(42,W/H,0.1,200);
scene.add(new THREE.AmbientLight(0xffffff,0.62));renderer.shadowMap.enabled=true;
const dl=new THREE.DirectionalLight(0xfff3e0,0.95);dl.position.set(-5,9,9);dl.castShadow=true;dl.shadow.mapSize.set(1024,1024);dl.shadow.camera.left=-8;dl.shadow.camera.right=8;dl.shadow.camera.top=8;dl.shadow.camera.bottom=-8;dl.shadow.bias=-.002;scene.add(dl);
const pB=new THREE.PointLight(C.sky,0,40);pB.position.set(-7,2,6);scene.add(pB);
const pO=new THREE.PointLight(C.orange,0,40);pO.position.set(7,-1,6);scene.add(pO);

const FLOOR=-3.6;
const grid=new THREE.GridHelper(80,80,C.sky,C.blue);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshLambertMaterial({color:0x183476,map:(()=>{const t=paperTex.clone();t.needsUpdate=true;t.repeat.set(8,8);return t;})()}));ground.rotation.x=-Math.PI/2;ground.position.y=FLOOR;ground.receiveShadow=true;scene.add(ground);
// floor glow disk
const disk=new THREE.Mesh(new THREE.CircleGeometry(6,64),new THREE.MeshBasicMaterial({color:C.blue,transparent:true,opacity:.12}));
disk.visible=false;

// particles
const NP=700,pr=rnd(7),pPos=new Float32Array(NP*3),pCol=new Float32Array(NP*3),pBase=[];
for(let i=0;i<NP;i++){pBase.push([ (pr()-.5)*30,(pr()-.5)*26,-pr()*30+6, pr()*6.28, .2+pr()*.6]);
  const c=new THREE.Color(pr()<.7?C.sky:C.orange);pCol.set([c.r,c.g,c.b],i*3);}
const pGeo=new THREE.BufferGeometry();pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const pts=new THREE.Points(pGeo,new THREE.PointsMaterial({size:.14,vertexColors:true,transparent:false,opacity:1,depthWrite:false}));
scene.add(pts);

// ---------- materials & factories ----------
const M=(color)=>new THREE.MeshLambertMaterial({color,map:paperTex});
const mBlue=()=>M(C.blue,.25),mSky=()=>M(C.sky,.25),mOr=()=>M(C.orange,.3),mAm=()=>M(C.amber,.3);
function edges(mesh,color){const l=new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry,20),new THREE.LineBasicMaterial({color:0x0B1A3D,transparent:true,opacity:.55}));mesh.add(l);return mesh;}
function bar(color,w=1.1,d=1.1){
  const g=new THREE.BoxGeometry(w,1,d);g.translate(0,.5,0);
  const m=edges(new THREE.Mesh(g,M(color,.14)),0xffffff);
  const grp=new THREE.Group();grp.add(m);grp.userData.m=m;return grp;
}
function setBarH(b,h){b.userData.m.scale.y=Math.max(h,0.0001);b.userData.h=h;}
function barTop(b,dy=0){const v=new THREE.Vector3(0,(b.userData.h||0)+dy,0);return b.localToWorld(v);}
function pie(fracs,colors,r=1.7,h=.5){
  const g=new THREE.Group();let a=0;g.userData.sl=[];
  fracs.forEach((f,i)=>{const th=f*Math.PI*2;
    const geo=new THREE.CylinderGeometry(r,r,h,96,1,false,a,th);
    const m=new THREE.Mesh(geo,M(colors[i],.28));m.userData.mid=a+th/2;g.add(m);g.userData.sl.push(m);a+=th;});
  return g;
}
function sliceDir(m){return new THREE.Vector3(Math.sin(m.userData.mid),0,Math.cos(m.userData.mid));}
function coin(){const g=new THREE.CylinderGeometry(.42,.42,.09,40);const m=new THREE.Mesh(g,M(C.orange));
  const rim=new THREE.Mesh(new THREE.TorusGeometry(.42,.03,8,40),M(0xF3EBDD));rim.rotation.x=Math.PI/2;m.add(rim);return m;}
function canvasTex(draw,w=512,h=680){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');draw(x,w,h);const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}
function docTex(title,sub){return canvasTex((x,w,h)=>{
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#F4F8FF');g.addColorStop(1,'#D9E6FF');x.fillStyle=g;x.fillRect(0,0,w,h);
  x.fillStyle='#1E6BFF';x.fillRect(0,0,w,90);x.fillStyle='#FF7A1A';x.fillRect(0,90,w,10);
  x.fillStyle='#fff';x.font='900 46px Inter';x.textAlign='center';x.fillText(title,w/2,62);
  x.fillStyle='#071433';let fs=40;do{x.font='800 '+fs+'px Inter';fs-=2;}while(x.measureText(sub).width>w-60);x.fillText(sub,w/2,170);
  for(let i=0;i<11;i++){x.fillStyle=i%4==3?'#FF7A1A':'#9fb6e6';const lw=(i%3==2?.6:.85)*(w-100);x.fillRect(50,220+i*38,lw,14);}
  x.fillStyle='#1E6BFF';x.fillRect(50,h-80,180,10);});}
function doc(title,sub,s=1){const m=new THREE.Mesh(new THREE.BoxGeometry(2.2*s,2.9*s,.05*s),[M(0xdfe8ff,.05),M(0xdfe8ff,.05),M(0xdfe8ff,.05),M(0xdfe8ff,.05),
  new THREE.MeshStandardMaterial({map:docTex(title,sub),roughness:.6,metalness:0,emissive:0xffffff,emissiveMap:docTex(title,sub),emissiveIntensity:.35}),M(0xbfd0f5,.05)]);return m;}
function note(){const tex=canvasTex((x,w,h)=>{x.fillStyle='#1E6BFF';x.fillRect(0,0,w,h);x.strokeStyle='#55B8FF';x.lineWidth=10;x.strokeRect(14,14,w-28,h-28);
  x.fillStyle='#FF7A1A';x.beginPath();x.arc(w/2,h/2,h*.28,0,7);x.fill();x.fillStyle='#fff';x.font='900 64px Inter';x.textAlign='center';x.fillText('R$',w/2,h/2+22);
  x.font='900 44px Inter';x.textAlign='left';x.fillText('100',30,70);},420,200);
  return new THREE.Mesh(new THREE.BoxGeometry(1.5,.72,.01),new THREE.MeshStandardMaterial({map:tex,emissive:0xffffff,emissiveMap:tex,emissiveIntensity:.35,roughness:.5,side:THREE.DoubleSide}));}

// ---------- 3D scene objects (each with window + update) ----------
const OBJ=[];
function add(o,t0,t1,upd,base=1){o.visible=false;scene.add(o);OBJ.push({o,t0,t1,upd,base});return o;}
function k01(t,t0,t1,i=.8,o=.5){return Math.min(eOut(prog(t,t0,t0+i)),1-eIO(prog(t,t1-o,t1)));}

// S1 — coin & banknote rain + floating budget docs
const rain=new THREE.Group();const rr=rnd(11);const RA=[];
for(let i=0;i<30;i++){const m=i%3==0?note():coin();m.userData={x:(rr()-.5)*12,z:-3-rr()*7,sp:1.2+rr()*1.6,off:rr()*14,rx:rr()*6,ry:rr()*6,vr:.6+rr()*2};rain.add(m);RA.push(m);}
add(rain,0,14.8,(t,k)=>{const boost=1+1.4*eOut(prog(t,4,5));RA.forEach(m=>{const u=m.userData;const y=7-((t*u.sp*boost*.8+u.off)%14);m.position.set(u.x,y,u.z);m.rotation.set(u.rx+t*u.vr,u.ry+t*u.vr*.7,0);});});
const docs1=new THREE.Group();[[-2.3,-1.4,.6,-.3],[2.4,-1.9,.2,.35],[0,-2.4,1.4,0]].forEach(([x,y,z,r],i)=>{const d=doc('LOA 2027',['RECEITAS','DESPESAS','ORÇAMENTO'][i],.75);d.position.set(x,y,z);d.userData={r,i};docs1.add(d);});
add(docs1,0.2,14.8,(t,k)=>{docs1.children.forEach(d=>{d.rotation.set(-.15,d.userData.r+Math.sin(t*.8+d.userData.i)*.25,Math.sin(t*.6+d.userData.i)*.08);d.position.y+=Math.sin(t*1.3+d.userData.i)*.002;});});

// S2 — LOA document then bars 2026 vs 2027
const loaDoc=doc('LOA','LEI ORÇAMENTÁRIA ANUAL',1.05);loaDoc.position.set(0,-1.9,0);
add(loaDoc,15.3,22,(t)=>{loaDoc.rotation.set(-.12,Math.sin((t-15)*.7)*.45,0);loaDoc.position.y=-1.9+Math.sin(t*1.2)*.08;});
const g2=new THREE.Group();const b26=bar(C.blue,1.3,1.3),b27=bar(C.orange,1.3,1.3);b26.position.set(-1.1,FLOOR,0);b27.position.set(1.1,FLOOR,0);g2.add(b26,b27);
add(g2,22,34.8,(t)=>{const s=3.2/11.135;setBarH(b26,10.555*s*eOut(prog(t,22.3,24)));setBarH(b27,11.135*s*eOut(prog(t,23,25)));g2.rotation.y=Math.sin(t*.35)*.28;});

// S3 — receitas vs despesas (fora de escala) + coin column for loans
const g3=new THREE.Group();const bRec=bar(C.blue,1.3,1.3),bDes=bar(C.orange,1.3,1.3);bRec.position.set(-1.1,FLOOR,0);bDes.position.set(1.1,FLOOR,0);
const gap=new THREE.Mesh(new THREE.BoxGeometry(1.36,1,1.36),new THREE.MeshBasicMaterial({color:C.orange,transparent:true,opacity:.25,depthWrite:false}));
edges(gap,C.orange);gap.position.set(-1.1,0,0);g3.add(bRec,bDes,gap);
add(g3,41,54,(t)=>{const hr=2.6*eOut(prog(t,41.3,43)),hd=3.2*eOut(prog(t,41.8,43.5));setBarH(bRec,hr);setBarH(bDes,hd);
  const gk=eOut(prog(t,43.6,44.6));gap.scale.set(1,Math.max(.001,(3.2-2.6)*gk),1);gap.position.y=FLOOR+2.6+(3.2-2.6)*gk/2;gap.material.opacity=.18+.14*Math.sin(t*6);gap.visible=gk>0;

// ---------- per-frame ----------
const sweep2=document.getElementById('sweep2');const prg=document.querySelector('#prog i'),scn=document.getElementById('scn'),sweep=document.getElementById('sweep'),flash=document.getElementById('flash'),sig=document.getElementById('sig');
const CAM=[ // per-scene camera [x,y,z, lookY]
 [0,.4,14,-.6],[0,.2,13,-.6],[.4,.2,13,-.6],[0,0,12.6,-.8],[-.3,.2,13,-.7],[0,.3,13,-.6],[.3,.2,12.8,-.8],[0,.2,13,-.6],[0,.3,13.2,-.6],[0,.6,14,-.4]];
function sceneIdx(t){for(let i=SC.length-2;i>=0;i--)if(t>=SC[i])return i;return 0;}
const vtmp=new THREE.Vector3();
function renderAt(tReal){
  const t=Math.floor(tReal*12+1e-6)/12, step6=Math.floor(tReal*6);
  const si=sceneIdx(t);
  // camera
  const prev=CAM[Math.max(0,si-1)],cur=CAM[si];const ck=eIO(prog(t,SC[si],SC[si]+1.2));
  const cx=lerp(prev[0],cur[0],ck)+Math.sin(t*.21)*.55,cy=lerp(prev[1],cur[1],ck)+Math.sin(t*.17)*.25,cz=lerp(prev[2],cur[2],ck)-Math.sin(t*.11)*.3;
  // little push-in at each scene start
  const push=(1-eOut(prog(t,SC[si],SC[si]+2)))*1.6;
  camera.position.set(cx,cy,cz+push);camera.lookAt(0,lerp(prev[3],cur[3],ck),0);
  // world
      for(let i=0;i<NP;i++){const b=pBase[i];pPos[i*3]=b[0]+Math.sin(t*b[4]+b[3])*.6;pPos[i*3+1]=((b[1]+t*b[4]*.4+13)%26)-13;pPos[i*3+2]=b[2];}
  pGeo.attributes.position.needsUpdate=true;
  OBJ.forEach(O=>{const k=k01(t,O.t0,O.t1);O.o.visible=k>0.002;if(O.o.visible){O.upd(t,k);const s=O.base*(.001+k);O.o.scale.setScalar(s);}});
  scene.updateMatrixWorld(true);
  renderer.render(scene,camera);
  // beats
  BEATS.forEach(b=>{
    const a=prog(t,b.t0,b.t0+.6),o=prog(t,b.t1-.4,b.t1);
    if(t<b.t0||t>b.t1){b.el.style.opacity=0;b.el.style.display='none';return;}
    b.el.style.display='block';
    const ka=eBack(a),ko=eIO(o);const op=ko>0.66?0:1;
    const jit=(hash(b.id*31+step6)-.5)*.9;
    const rot=b.rot+(1-clamp(ka))*(b.id%2?9:-9)+ko*(b.id%2?-14:14)+jit;
    let tr=`translateY(${ko*140}px) rotate(${rot}deg) scale(${b.fx==='zoom'?1.6-.6*ka:1.25-.25*ka})`;
    if(b.anchor){vtmp.copy(b.anchor()).project(camera);const x=(vtmp.x+1)/2*W,y=(1-vtmp.y)/2*H;b.el.style.left=x+'px';b.el.style.top=y+'px';
      b.el.style.transform=({left:'translate(0,-50%) ',below:'translate(-50%,0) ',mid:'translate(-50%,-50%) ',top:'translate(-50%,-100%) '})[b.mode]+tr;}
    else b.el.style.transform=`translateX(-50%) `+tr;
    b.el.style.opacity=op;b.megas.forEach(m=>renderMega(m,t,b));
    b.nums.forEach(n=>{const d=+n.dataset.d,dl=+n.dataset.delay,du=+n.dataset.dur,to=+n.dataset.to,fr=+n.dataset.from;
      n.textContent=fmt(lerp(fr,to,eOut(prog(t,b.t0+dl,b.t0+dl+du))),d);});
    b.stag.forEach((s,i)=>{const k=eBack(prog(t,b.t0+.35+i*.22,b.t0+.85+i*.22));s.style.opacity=k>0.05?1:0;s.style.transform=`rotate(${(i%2?3:-3)+(1-k)*20}deg) scale(${1.4-.4*clamp(k,0,1.2)})`;});
  });
  // HUD
  prg.style.width=(clamp(t/DUR)*100)+'%';scn.textContent=String(si+1).padStart(2,'0')+' / 10';
  const sk=Math.min(eOut(prog(t,.3,1.2)),1-eIO(prog(t,237.6,238.3)));sig.style.opacity=sk;
  // transitions: orange light sweep + soft flash
  let sw=-1;for(let i=1;i<SC.length-1;i++){if(Math.abs(t-SC[i])<.55)sw=(t-SC[i]+.55)/1.1;}
  const sw2=sw<0?-1:clamp(sw-.08);[[sweep,sw],[sweep2,sw2]].forEach(([el,v])=>{if(v<0||v>=1){el.style.left='-1800px';return;}el.style.left=(-1800+eIO(v)*3200)+'px';});
  let fl=0;[4.2,225.4,237.2].forEach(x=>{fl=Math.max(fl,(1-prog(t,x,x+.5))*(t>=x?1:0)*.35);});
  for(let i=1;i<SC.length-1;i++)if(t>=SC[i])fl=Math.max(fl,(1-prog(t,SC[i],SC[i]+.35))*.12);
  flash.style.opacity=fl*.6;document.getElementById('grainov').style.backgroundPosition=`${Math.floor(hash(step6)*300)}px ${Math.floor(hash(step6+9)*300)}px`;
  return true;
}
scene.traverse(o=>{if(o.isMesh&&o!==ground)o.castShadow=true;});
window.renderAt=renderAt;window.DUR=DUR;
