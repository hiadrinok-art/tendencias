<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>LOA 2027 Recife — Eduardo Moura</title>
<style>
  :root{
    --navy:#030817; --deep:#071433; --blue:#1E6BFF; --sky:#55B8FF;
    --orange:#FF7A1A; --amber:#FFB25E; --white:#F4F8FF; --mute:#B9CCF2;
  }
  html,body{margin:0;padding:0;background:var(--navy);}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;
    font-family:'Inter',sans-serif;color:var(--white);
    background:
      radial-gradient(1200px 900px at 50% 38%, rgba(30,107,255,.30), transparent 60%),
      radial-gradient(900px 700px at 50% 105%, rgba(255,122,26,.22), transparent 60%),
      linear-gradient(180deg,#040B22 0%, #030817 55%, #050A1A 100%);}
  #glow{position:absolute;inset:0;pointer-events:none;}
  canvas{position:absolute;inset:0;}
  #ov{position:absolute;inset:0;}
  .beat{text-shadow:0 4px 28px rgba(0,0,0,.75);position:absolute;left:540px;width:960px;text-align:center;opacity:0;transform-origin:50% 50%;}
  .anc{width:auto;white-space:nowrap;}
  .h1{font-family:'Inter Display','Inter';font-weight:900;font-size:92px;line-height:1.02;letter-spacing:-2px;text-transform:uppercase;}
  .h2{font-family:'Inter Display','Inter';font-weight:800;font-size:62px;line-height:1.1;letter-spacing:-1px;}
  .p{font-weight:600;font-size:48px;line-height:1.25;color:var(--mute);}
  .p b{color:var(--white);}
  .mega{font-family:'Inter Display','Inter';font-weight:900;font-size:168px;line-height:1;letter-spacing:-5px;color:var(--orange);
        text-shadow:0 0 40px rgba(255,122,26,.55),0 6px 0 #8a3500;}
  .mega.blue{color:var(--sky);text-shadow:0 0 40px rgba(85,184,255,.55),0 6px 0 #0b3a8a;}
  .unit{font-family:'Inter Display','Inter';font-weight:900;font-size:70px;letter-spacing:6px;color:var(--white);text-transform:uppercase;}
  .hl{color:var(--orange);} .hb{color:var(--sky);}
  .kicker{display:inline-block;font-weight:900;font-size:30px;letter-spacing:7px;text-transform:uppercase;
          color:#fff;background:linear-gradient(90deg,var(--orange),#ff9a3d);padding:14px 28px;border-radius:999px;
          box-shadow:0 0 30px rgba(255,122,26,.45);}
  .kicker.blue{background:linear-gradient(90deg,#1E6BFF,#3d8bff);box-shadow:0 0 30px rgba(30,107,255,.5);}
  .card{display:inline-block;background:linear-gradient(180deg,rgba(18,48,120,.72),rgba(8,22,60,.72));
        border:2px solid rgba(85,184,255,.55);border-radius:30px;padding:34px 44px;box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 0 40px rgba(30,107,255,.18);}
  .card.warn{border-color:rgba(255,122,26,.8);box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 0 40px rgba(255,122,26,.18);}
  .badge{font-weight:900;font-size:30px;letter-spacing:5px;text-transform:uppercase;margin-bottom:14px;}
  .chips{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:30px;}
  .chip{font-weight:800;font-size:40px;padding:16px 30px;border-radius:20px;border:2px solid var(--sky);color:var(--white);background:rgba(30,107,255,.22);}
  .chip.o{border-color:var(--orange);background:rgba(255,122,26,.2);}
  .lab{text-align:center;}
  .lab .y{font-weight:800;font-size:34px;letter-spacing:4px;color:var(--mute);}
  .lab .v{font-family:'Inter Display','Inter';font-weight:900;font-size:56px;letter-spacing:-1px;}
  .lab .s{font-weight:700;font-size:30px;color:var(--mute);}
  .tiny{font-weight:600;font-size:24px;color:rgba(185,204,242,.6);letter-spacing:1px;}
  /* persistent HUD */
  #hud-top{position:absolute;left:60px;right:60px;top:70px;display:flex;justify-content:space-between;align-items:center;}
  #hud-top .t{font-weight:900;font-size:28px;letter-spacing:6px;color:var(--white);}
  #hud-top .t span{color:var(--orange);}
  #hud-top .n{font-weight:800;font-size:28px;letter-spacing:4px;color:var(--mute);}
  #prog{position:absolute;left:60px;right:60px;top:128px;height:6px;border-radius:6px;background:rgba(85,184,255,.18);overflow:hidden;}
  #prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--orange));}
  #sig{position:absolute;left:0;right:0;bottom:70px;display:flex;flex-direction:column;align-items:center;}
  #sig .bar{width:90px;height:7px;border-radius:7px;background:var(--orange);margin-bottom:16px;box-shadow:0 0 20px rgba(255,122,26,.7);}
  #sig .name{font-family:'Inter Display','Inter';font-weight:900;font-size:46px;letter-spacing:12px;}
  #sig .name b{color:var(--orange);font-weight:900;}
  #sig .role{font-weight:700;font-size:22px;letter-spacing:6px;color:var(--mute);margin-top:6px;}
  #sweep{position:absolute;top:-400px;left:-600px;width:500px;height:3000px;opacity:0;
         background:linear-gradient(90deg,transparent,rgba(255,122,26,.0) 20%,rgba(255,150,60,.85) 50%,rgba(85,184,255,.0) 80%,transparent);
         transform:rotate(18deg);filter:blur(6px);}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
  /* final logo */
  .logo .em{font-family:'Inter Display','Inter';font-weight:900;font-size:120px;letter-spacing:10px;line-height:.95;}
  .logo .em b{color:var(--orange);}
  .logo .line{width:520px;height:10px;margin:30px auto;border-radius:10px;background:linear-gradient(90deg,var(--blue),var(--orange));box-shadow:0 0 30px rgba(255,122,26,.6);}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="ov"></div>
  <div id="hud-top"><div class="t">LOA <span>2027</span> · RECIFE</div><div class="n" id="scn">01 / 10</div></div>
  <div id="prog"><i></i></div>
  <div id="sig"><div class="bar"></div><div class="name">EDUARDO <b>MOURA</b></div><div class="role">ANÁLISE DO ORÇAMENTO PÚBLICO</div></div>
  <div id="sweep"></div>
  <div id="flash"></div>
</div>
<script src="node_modules/three/build/three.min.js"></script>
<script>
const W=1080,H=1920,DUR=240;
THREE.ColorManagement.legacyMode=false;
const SC=[0,15,35,60,90,120,140,165,195,225,240];
const C={blue:0x1E6BFF,sky:0x55B8FF,orange:0xFF7A1A,amber:0xFFB25E,navy:0x071433,white:0xF4F8FF};

// ---------- math helpers ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3);
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const lerp=(a,b,k)=>a+(b-a)*k;
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const fmt=(v,d)=>v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});

// ---------- three setup ----------
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x030817,18,46);
const camera=new THREE.PerspectiveCamera(42,W/H,0.1,200);
scene.add(new THREE.AmbientLight(0x6f86c9,0.55));
const dl=new THREE.DirectionalLight(0xffffff,1.1);dl.position.set(3,8,10);scene.add(dl);
const pB=new THREE.PointLight(C.sky,2.2,40);pB.position.set(-7,2,6);scene.add(pB);
const pO=new THREE.PointLight(C.orange,2.4,40);pO.position.set(7,-1,6);scene.add(pO);

const FLOOR=-3.6;
const grid=new THREE.GridHelper(80,80,C.sky,C.blue);
grid.material.transparent=true;grid.material.opacity=.22;grid.position.y=FLOOR;scene.add(grid);
// floor glow disk
const disk=new THREE.Mesh(new THREE.CircleGeometry(6,64),new THREE.MeshBasicMaterial({color:C.blue,transparent:true,opacity:.12}));
disk.rotation.x=-Math.PI/2;disk.position.y=FLOOR+0.01;scene.add(disk);

// particles
const NP=700,pr=rnd(7),pPos=new Float32Array(NP*3),pCol=new Float32Array(NP*3),pBase=[];
for(let i=0;i<NP;i++){pBase.push([ (pr()-.5)*30,(pr()-.5)*26,-pr()*30+6, pr()*6.28, .2+pr()*.6]);
  const c=new THREE.Color(pr()<.7?C.sky:C.orange);pCol.set([c.r,c.g,c.b],i*3);}
const pGeo=new THREE.BufferGeometry();pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const pts=new THREE.Points(pGeo,new THREE.PointsMaterial({size:.07,vertexColors:true,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(pts);

// ---------- materials & factories ----------
const M=(color,em=0.10,metal=0.35,rough=0.32)=>new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:em,metalness:metal,roughness:rough});
const mBlue=()=>M(C.blue,.25),mSky=()=>M(C.sky,.25),mOr=()=>M(C.orange,.3),mAm=()=>M(C.amber,.3);
function edges(mesh,color){const l=new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry,20),new THREE.LineBasicMaterial({color,transparent:true,opacity:.9}));mesh.add(l);return mesh;}
function bar(color,w=1.1,d=1.1){
  const g=new THREE.BoxGeometry(w,1,d);g.translate(0,.5,0);
  const m=edges(new THREE.Mesh(g,M(color,.14)),0xffffff);
  const grp=new THREE.Group();grp.add(m);grp.userData.m=m;return grp;
}
function setBarH(b,h){b.userData.m.scale.y=Math.max(h,0.0001);b.userData.h=h;}
function barTop(b,dy=0){const v=new THREE.Vector3(0,(b.userData.h||0)+dy,0);return b.localToWorld(v);}
function pie(fracs,colors,r=1.7,h=.5){
  const g=new THREE.Group();let a=0;g.userData.sl=[];
  fracs.forEach((f,i)=>{const th=f*Math.PI*2;
    const geo=new THREE.CylinderGeometry(r,r,h,96,1,false,a,th);
    const m=new THREE.Mesh(geo,M(colors[i],.28));m.userData.mid=a+th/2;g.add(m);g.userData.sl.push(m);a+=th;});
  return g;
}
function sliceDir(m){return new THREE.Vector3(Math.sin(m.userData.mid),0,Math.cos(m.userData.mid));}
function coin(){const g=new THREE.CylinderGeometry(.42,.42,.09,40);const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:C.orange,emissive:C.orange,emissiveIntensity:.25,metalness:.6,roughness:.28}));
  const rim=new THREE.Mesh(new THREE.TorusGeometry(.42,.03,8,40),new THREE.MeshStandardMaterial({color:C.amber,emissive:C.amber,emissiveIntensity:.4,metalness:.6,roughness:.3}));rim.rotation.x=Math.PI/2;m.add(rim);return m;}
function canvasTex(draw,w=512,h=680){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');draw(x,w,h);const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}
function docTex(title,sub){return canvasTex((x,w,h)=>{
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#F4F8FF');g.addColorStop(1,'#D9E6FF');x.fillStyle=g;x.fillRect(0,0,w,h);
  x.fillStyle='#1E6BFF';x.fillRect(0,0,w,90);x.fillStyle='#FF7A1A';x.fillRect(0,90,w,10);
  x.fillStyle='#fff';x.font='900 46px Inter';x.textAlign='center';x.fillText(title,w/2,62);
  x.fillStyle='#071433';let fs=40;do{x.font='800 '+fs+'px Inter';fs-=2;}while(x.measureText(sub).width>w-60);x.fillText(sub,w/2,170);
  for(let i=0;i<11;i++){x.fillStyle=i%4==3?'#FF7A1A':'#9fb6e6';const lw=(i%3==2?.6:.85)*(w-100);x.fillRect(50,220+i*38,lw,14);}
  x.fillStyle='#1E6BFF';x.fillRect(50,h-80,180,10);});}
function doc(title,sub,s=1){const m=new THREE.Mesh(new THREE.BoxGeometry(2.2*s,2.9*s,.05*s),[M(0xdfe8ff,.05),M(0xdfe8ff,.05),M(0xdfe8ff,.05),M(0xdfe8ff,.05),
  new THREE.MeshStandardMaterial({map:docTex(title,sub),roughness:.6,metalness:0,emissive:0xffffff,emissiveMap:docTex(title,sub),emissiveIntensity:.35}),M(0xbfd0f5,.05)]);return m;}
function note(){const tex=canvasTex((x,w,h)=>{x.fillStyle='#1E6BFF';x.fillRect(0,0,w,h);x.strokeStyle='#55B8FF';x.lineWidth=10;x.strokeRect(14,14,w-28,h-28);
  x.fillStyle='#FF7A1A';x.beginPath();x.arc(w/2,h/2,h*.28,0,7);x.fill();x.fillStyle='#fff';x.font='900 64px Inter';x.textAlign='center';x.fillText('R$',w/2,h/2+22);
  x.font='900 44px Inter';x.textAlign='left';x.fillText('100',30,70);},420,200);
  return new THREE.Mesh(new THREE.BoxGeometry(1.5,.72,.01),new THREE.MeshStandardMaterial({map:tex,emissive:0xffffff,emissiveMap:tex,emissiveIntensity:.35,roughness:.5,side:THREE.DoubleSide}));}

// ---------- 3D scene objects (each with window + update) ----------
const OBJ=[];
function add(o,t0,t1,upd,base=1){o.visible=false;scene.add(o);OBJ.push({o,t0,t1,upd,base});return o;}
function k01(t,t0,t1,i=.8,o=.5){return Math.min(eOut(prog(t,t0,t0+i)),1-eIO(prog(t,t1-o,t1)));}

// S1 — coin & banknote rain + floating budget docs
const rain=new THREE.Group();const rr=rnd(11);const RA=[];
for(let i=0;i<30;i++){const m=i%3==0?note():coin();m.userData={x:(rr()-.5)*12,z:-3-rr()*7,sp:1.2+rr()*1.6,off:rr()*14,rx:rr()*6,ry:rr()*6,vr:.6+rr()*2};rain.add(m);RA.push(m);}
add(rain,0,14.8,(t,k)=>{const boost=1+1.4*eOut(prog(t,4,5));RA.forEach(m=>{const u=m.userData;const y=7-((t*u.sp*boost*.8+u.off)%14);m.position.set(u.x,y,u.z);m.rotation.set(u.rx+t*u.vr,u.ry+t*u.vr*.7,0);});});
const docs1=new THREE.Group();[[-2.3,-1.4,.6,-.3],[2.4,-1.9,.2,.35],[0,-2.4,1.4,0]].forEach(([x,y,z,r],i)=>{const d=doc('LOA 2027',['RECEITAS','DESPESAS','ORÇAMENTO'][i],.75);d.position.set(x,y,z);d.userData={r,i};docs1.add(d);});
add(docs1,0.2,14.8,(t,k)=>{docs1.children.forEach(d=>{d.rotation.set(-.15,d.userData.r+Math.sin(t*.8+d.userData.i)*.25,Math.sin(t*.6+d.userData.i)*.08);d.position.y+=Math.sin(t*1.3+d.userData.i)*.002;});});

// S2 — LOA document then bars 2026 vs 2027
const loaDoc=doc('LOA','LEI ORÇAMENTÁRIA ANUAL',1.05);loaDoc.position.set(0,-1.9,0);
add(loaDoc,15.3,22,(t)=>{loaDoc.rotation.set(-.12,Math.sin((t-15)*.7)*.45,0);loaDoc.position.y=-1.9+Math.sin(t*1.2)*.08;});
const g2=new THREE.Group();const b26=bar(C.blue,1.3,1.3),b27=bar(C.orange,1.3,1.3);b26.position.set(-1.1,FLOOR,0);b27.position.set(1.1,FLOOR,0);g2.add(b26,b27);
add(g2,22,34.8,(t)=>{const s=3.2/11.135;setBarH(b26,10.555*s*eOut(prog(t,22.3,24)));setBarH(b27,11.135*s*eOut(prog(t,23,25)));g2.rotation.y=Math.sin(t*.35)*.28;});

// S3 — receitas vs despesas (fora de escala) + coin column for loans
const g3=new THREE.Group();const bRec=bar(C.blue,1.3,1.3),bDes=bar(C.orange,1.3,1.3);bRec.position.set(-1.1,FLOOR,0);bDes.position.set(1.1,FLOOR,0);
const gap=new THREE.Mesh(new THREE.BoxGeometry(1.36,1,1.36),new THREE.MeshBasicMaterial({color:C.orange,transparent:true,opacity:.25,depthWrite:false}));
edges(gap,C.orange);gap.position.set(-1.1,0,0);g3.add(bRec,bDes,gap);
add(g3,41,54,(t)=>{const hr=2.6*eOut(prog(t,41.3,43)),hd=3.2*eOut(prog(t,41.8,43.5));setBarH(bRec,hr);setBarH(bDes,hd);
  const gk=eOut(prog(t,43.6,44.6));gap.scale.set(1,Math.max(.001,(3.2-2.6)*gk),1);gap.position.y=FLOOR+2.6+(3.2-2.6)*gk/2;gap.material.opacity=.18+.14*Math.sin(t*6);gap.visible=gk>0;
  g3.rotation.y=Math.sin(t*.35)*.25;});
const col=new THREE.Group();const COLN=26;for(let i=0;i<COLN;i++){const c=coin();c.scale.set(2.1,1.6,2.1);col.add(c);}col.position.set(0,FLOOR,0);
add(col,54,59.8,(t)=>{col.children.forEach((c,i)=>{const k=eOut(prog(t,54.2+i*.07,54.6+i*.07));c.position.set(Math.sin(i*1.7)*.05,.08+i*.15+(1-k)*6,Math.cos(i*1.3)*.05);c.visible=k>0;c.rotation.y=i*.4;});col.rotation.y=t*.5;});

// S4 — saúde: cross, then pie 97,25 / 2,75
const cross=new THREE.Group();const cb1=edges(new THREE.Mesh(new THREE.BoxGeometry(2.6,.85,.85),mBlue()),C.sky),cb2=edges(new THREE.Mesh(new THREE.BoxGeometry(.85,2.6,.85),mBlue()),C.sky);
cross.add(cb1,cb2);const crossRing=new THREE.Mesh(new THREE.TorusGeometry(2.1,.06,12,120),new THREE.MeshBasicMaterial({color:C.orange}));cross.add(crossRing);cross.position.set(0,-1.6,0);
add(cross,60.3,69,(t)=>{cross.rotation.set(Math.sin(t*.6)*.25,t*.8,0);crossRing.rotation.set(Math.PI/2+Math.sin(t)*.3,0,0);});
const pie4=pie([.9725,.0275],[C.blue,C.orange],1.75,.55);pie4.position.set(0,-1.9,0);
add(pie4,69,87.4,(t)=>{pie4.rotation.set(.95,2.38+Math.sin(t*.3)*.15,0);const s=pie4.userData.sl[1];const pk=eBack(prog(t,71,72.2));s.position.copy(sliceDir(s).multiplyScalar(.75*pk));s.position.y=.35*pk;
  const dim=(t>78&&t<82.5)?.6:1;pie4.userData.sl[0].material.emissiveIntensity=.28*dim;});
function sliceWorld(p,i,extra=0){const s=p.userData.sl[i];const v=sliceDir(s).multiplyScalar(1.75*.7+extra).add(s.position);v.y+=.3;return p.localToWorld(v);}

// S5 — educação: books, ring 5,22%, +/- bars
const books=new THREE.Group();[[C.blue,0],[C.orange,.62],[C.sky,1.24]].forEach(([c,y],i)=>{const b=edges(new THREE.Mesh(new THREE.BoxGeometry(2.6-i*.25,.5,1.8-i*.15),M(c,.28)),0xffffff);b.position.set(i*.12-.1,y,0);b.rotation.y=i*.2-.2;books.add(b);});
books.position.set(0,-2.4,0);add(books,90.3,96,(t)=>{books.rotation.y=Math.sin(t*.7)*.5;books.position.y=-2.4+Math.sin(t*1.4)*.06;});
const ring=new THREE.Group();const rA=new THREE.Mesh(new THREE.TorusGeometry(1.6,.32,24,160,Math.PI*2*(1-.0522)),M(C.blue,.25));
const rB=new THREE.Mesh(new THREE.TorusGeometry(1.6,.36,24,40,Math.PI*2*.0522),M(C.orange,.45));rB.rotation.z=-Math.PI*2*.0522;ring.add(rA,rB);ring.position.set(0,-1.7,0);
add(ring,96,102,(t)=>{ring.rotation.set(-.45+Math.sin(t*.5)*.1,Math.sin(t*.6)*.35,Math.PI/2+.2);rB.scale.setScalar(1+.06*Math.sin(t*5));});
const g5=new THREE.Group();const ZERO=-1.4;const bPes=bar(C.sky,1.3,1.3),bOut=bar(C.orange,1.3,1.3);bPes.position.set(-1.1,ZERO,0);bOut.position.set(1.1,ZERO,0);
const zl=new THREE.Mesh(new THREE.BoxGeometry(4.8,.04,.04),new THREE.MeshBasicMaterial({color:0xffffff}));zl.position.y=ZERO;g5.add(bPes,bOut,zl);
add(g5,102,111,(t)=>{const s=2.1/488.5;setBarH(bOut,488.5*s*eOut(prog(t,103,104.8)));const hp=209.8*s*eOut(prog(t,102.4,104));bPes.userData.m.scale.y=-Math.max(hp,.0001);bPes.userData.h=-hp;g5.rotation.y=Math.sin(t*.35)*.25;});

// S6 — segurança: shield, bars 28,6 / 50,2
const sh=new THREE.Shape();sh.moveTo(0,1.6);sh.quadraticCurveTo(.9,1.25,1.45,1.35);sh.quadraticCurveTo(1.5,-.4,0,-1.6);sh.quadraticCurveTo(-1.5,-.4,-1.45,1.35);sh.quadraticCurveTo(-.9,1.25,0,1.6);
const shield=edges(new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:.35,bevelEnabled:true,bevelSize:.06,bevelThickness:.06,bevelSegments:3}),mBlue()),C.orange);
const star=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.2,5),mOr());star.rotation.x=Math.PI/2;star.position.z=.45;shield.add(star);shield.position.set(0,-1.7,0);

  grid.position.z=(t*1.2)%1;
  pO.intensity=2.2+Math.sin(t*1.7)*.4;pB.intensity=2+Math.cos(t*1.3)*.4;
  for(let i=0;i<NP;i++){const b=pBase[i];pPos[i*3]=b[0]+Math.sin(t*b[4]+b[3])*.6;pPos[i*3+1]=((b[1]+t*b[4]*.4+13)%26)-13;pPos[i*3+2]=b[2];}
  pGeo.attributes.position.needsUpdate=true;
  OBJ.forEach(O=>{const k=k01(t,O.t0,O.t1);O.o.visible=k>0.002;if(O.o.visible){O.upd(t,k);const s=O.base*(.001+k);O.o.scale.setScalar(s);}});
  scene.updateMatrixWorld(true);
  renderer.render(scene,camera);
  // beats
  BEATS.forEach(b=>{
    const a=prog(t,b.t0,b.t0+.6),o=prog(t,b.t1-.4,b.t1);
    if(t<b.t0||t>b.t1){b.el.style.opacity=0;b.el.style.display='none';return;}
    b.el.style.display='block';
    const ka=eOut(a),ko=eIO(o);const op=Math.min(ka,1-ko);
    let tr='';
    if(b.fx==='zoom'){tr=`perspective(1000px) translateZ(${(1-ka)*-500+ko*300}px) rotateX(${(1-ka)*25}deg)`;}
    else{tr=`perspective(1000px) translateY(${(1-ka)*70-ko*50}px) rotateX(${(1-ka)*35}deg)`;}
    if(b.anchor){vtmp.copy(b.anchor()).project(camera);const x=(vtmp.x+1)/2*W,y=(1-vtmp.y)/2*H;b.el.style.left=x+'px';b.el.style.top=y+'px';
      b.el.style.transform=({left:'translate(0,-50%) ',below:'translate(-50%,0) ',mid:'translate(-50%,-50%) ',top:'translate(-50%,-100%) '})[b.mode]+tr;}
    else b.el.style.transform=`translateX(-50%) `+tr;
    b.el.style.opacity=op;b.el.style.filter=ko>0?`blur(${ko*10}px)`:'none';
    b.nums.forEach(n=>{const d=+n.dataset.d,dl=+n.dataset.delay,du=+n.dataset.dur,to=+n.dataset.to,fr=+n.dataset.from;
      n.textContent=fmt(lerp(fr,to,eOut(prog(t,b.t0+dl,b.t0+dl+du))),d);});
    b.stag.forEach((s,i)=>{const k=eBack(prog(t,b.t0+.35+i*.22,b.t0+.85+i*.22));s.style.opacity=clamp(k);s.style.transform=`translateY(${(1-k)*40}px) scale(${.7+.3*k})`;});
  });
  // HUD
  prg.style.width=(clamp(t/DUR)*100)+'%';scn.textContent=String(si+1).padStart(2,'0')+' / 10';
  const sk=Math.min(eOut(prog(t,.3,1.2)),1-eIO(prog(t,237.6,238.3)));sig.style.opacity=sk;
  // transitions: orange light sweep + soft flash
  let sw=-1;for(let i=1;i<SC.length-1;i++){if(Math.abs(t-SC[i])<.6)sw=(t-SC[i]+.6)/1.2;}
  if(sw>=0){sweep.style.opacity=Math.sin(sw*Math.PI)*.9;sweep.style.left=(-700+sw*2600)+'px';}else sweep.style.opacity=0;
  let fl=0;[4.2,225.4,237.2].forEach(x=>{fl=Math.max(fl,(1-prog(t,x,x+.5))*(t>=x?1:0)*.35);});
  for(let i=1;i<SC.length-1;i++)if(t>=SC[i])fl=Math.max(fl,(1-prog(t,SC[i],SC[i]+.35))*.12);
  flash.style.opacity=fl;
  return true;
}
window.renderAt=renderAt;window.DUR=DUR;
renderAt(0);
</script>
